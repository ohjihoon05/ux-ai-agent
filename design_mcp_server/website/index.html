<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Library - Modern UI Components</title>
  <meta name="description" content="Browse, preview, and copy modern UI components with glassmorphism, gradients, and more">
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-pink-50 min-h-screen">
  <!-- Navigation -->
  <nav class="glass-nav sticky top-0 z-50 backdrop-blur-lg bg-white/30 border-b border-white/20">
    <div class="container mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-8">
          <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
            Component Library
          </h1>
          <div class="hidden md:flex space-x-6">
            <a href="/" class="nav-link">홈</a>
            <a href="/pages/customize.html" class="nav-link">커스터마이즈</a>
            <a href="/pages/design-system.html" class="nav-link">디자인 시스템</a>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <button id="theme-toggle" class="p-2 rounded-lg hover:bg-white/20 transition-colors">
            🌙
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="container mx-auto px-6 py-16">
    <div class="text-center max-w-4xl mx-auto">
      <h2 class="text-5xl font-bold mb-6 bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 bg-clip-text text-transparent">
        모던 UI 컴포넌트 라이브러리
      </h2>
      <p class="text-xl text-gray-600 mb-8">
        50+ 개의 최신 디자인 트렌드를 적용한 UI 컴포넌트를 탐색하고 복사하세요
      </p>

      <!-- Search Bar -->
      <div class="max-w-2xl mx-auto mb-12">
        <div class="relative">
          <input
            type="text"
            id="search-input"
            placeholder="컴포넌트 검색..."
            class="w-full px-6 py-4 rounded-2xl glass-card border-2 border-white/30 focus:border-purple-500 focus:outline-none transition-all"
          >
          <button class="absolute right-3 top-1/2 -translate-y-1/2 px-6 py-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl hover:shadow-lg transition-all">
            검색
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-6 max-w-2xl mx-auto">
        <div class="glass-card p-6 rounded-2xl">
          <div class="text-3xl font-bold text-purple-600">50+</div>
          <div class="text-gray-600 mt-2">컴포넌트</div>
        </div>
        <div class="glass-card p-6 rounded-2xl">
          <div class="text-3xl font-bold text-pink-600">8</div>
          <div class="text-gray-600 mt-2">카테고리</div>
        </div>
        <div class="glass-card p-6 rounded-2xl">
          <div class="text-3xl font-bold text-blue-600">100%</div>
          <div class="text-gray-600 mt-2">무료</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Category Filters -->
  <section class="container mx-auto px-6 mb-12">
    <div class="flex flex-wrap gap-3 justify-center" id="category-filters">
      <button class="filter-btn active" data-category="all">전체</button>
      <button class="filter-btn" data-category="buttons">버튼</button>
      <button class="filter-btn" data-category="cards">카드</button>
      <button class="filter-btn" data-category="forms">폼</button>
      <button class="filter-btn" data-category="navigation">네비게이션</button>
      <button class="filter-btn" data-category="modals">모달</button>
      <button class="filter-btn" data-category="tables">테이블</button>
      <button class="filter-btn" data-category="layouts">레이아웃</button>
    </div>
  </section>

  <!-- Popular Components -->
  <section class="container mx-auto px-6 mb-16">
    <h3 class="text-3xl font-bold mb-8">인기 컴포넌트</h3>
    <div id="popular-components" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Components will be loaded here dynamically -->
      <div class="loading-skeleton">Loading...</div>
    </div>
  </section>

  <!-- All Components -->
  <section class="container mx-auto px-6 mb-16">
    <h3 class="text-3xl font-bold mb-8">모든 컴포넌트</h3>
    <div id="all-components" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Components will be loaded here dynamically -->
    </div>
  </section>

  <!-- Footer -->
  <footer class="glass-card mt-20 py-12">
    <div class="container mx-auto px-6 text-center">
      <p class="text-gray-600">
        Component Library © 2025 · Made with ❤️
      </p>
    </div>
  </footer>

  <script type="module" src="/src/scripts/main.js"></script>
</body>
</html>
