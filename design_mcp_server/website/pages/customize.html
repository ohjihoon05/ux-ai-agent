<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customize - Component Library</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-pink-50 min-h-screen">
  <!-- Navigation -->
  <nav class="glass-nav sticky top-0 z-50 backdrop-blur-lg bg-white/30 border-b border-white/20">
    <div class="container mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
          <a href="/">Component Library</a>
        </h1>
        <a href="/" class="text-gray-600 hover:text-purple-600 transition-colors">← 돌아가기</a>
      </div>
    </div>
  </nav>

  <!-- Customize Interface -->
  <div class="container mx-auto px-6 py-12">
    <!-- Header -->
    <div class="mb-8">
      <h2 class="text-4xl font-bold mb-4 bg-gradient-to-r from-purple-600 via-pink-600 to-blue-600 bg-clip-text text-transparent">
        컴포넌트 커스터마이즈
      </h2>
      <p class="text-gray-600">실시간으로 컴포넌트를 수정하고 나만의 스타일을 만들어보세요</p>
    </div>

    <!-- Component Selection -->
    <div class="glass-card p-6 rounded-3xl mb-8">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium mb-2">컴포넌트 선택</label>
          <select id="component-select" class="w-full px-4 py-2 rounded-xl border border-gray-300 bg-white">
            <option value="">컴포넌트를 선택하세요...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">변형 선택</label>
          <select id="variant-select" class="w-full px-4 py-2 rounded-xl border border-gray-300 bg-white" disabled>
            <option value="">변형을 선택하세요...</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">프리셋 불러오기</label>
          <select id="preset-select" class="w-full px-4 py-2 rounded-xl border border-gray-300 bg-white" disabled>
            <option value="">프리셋을 선택하세요...</option>
          </select>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Controls -->
      <div class="space-y-6">
        <!-- Color Controls -->
        <div class="glass-card p-6 rounded-3xl">
          <h3 class="text-lg font-semibold mb-4 flex items-center">
            🎨 색상
          </h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-2">Primary Color</label>
              <div class="flex items-center space-x-3">
                <input type="color" id="primary-color" value="#667eea" class="w-16 h-12 rounded-xl cursor-pointer border-2 border-gray-300">
                <input type="text" id="primary-color-hex" value="#667eea" class="flex-1 px-3 py-2 rounded-xl border border-gray-300 bg-white text-sm font-mono">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Secondary Color</label>
              <div class="flex items-center space-x-3">
                <input type="color" id="secondary-color" value="#764ba2" class="w-16 h-12 rounded-xl cursor-pointer border-2 border-gray-300">
                <input type="text" id="secondary-color-hex" value="#764ba2" class="flex-1 px-3 py-2 rounded-xl border border-gray-300 bg-white text-sm font-mono">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Accent Color</label>
              <div class="flex items-center space-x-3">
                <input type="color" id="accent-color" value="#4facfe" class="w-16 h-12 rounded-xl cursor-pointer border-2 border-gray-300">
                <input type="text" id="accent-color-hex" value="#4facfe" class="flex-1 px-3 py-2 rounded-xl border border-gray-300 bg-white text-sm font-mono">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Text Color</label>
              <div class="flex items-center space-x-3">
                <input type="color" id="text-color" value="#ffffff" class="w-16 h-12 rounded-xl cursor-pointer border-2 border-gray-300">
                <input type="text" id="text-color-hex" value="#ffffff" class="flex-1 px-3 py-2 rounded-xl border border-gray-300 bg-white text-sm font-mono">
              </div>
            </div>
          </div>
        </div>

        <!-- Size Controls -->
        <div class="glass-card p-6 rounded-3xl">
          <h3 class="text-lg font-semibold mb-4 flex items-center">
            📏 크기
          </h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-2">Size Preset</label>
              <select id="size-select" class="w-full px-4 py-2 rounded-xl border border-gray-300 bg-white">
                <option value="xs">Extra Small</option>
                <option value="sm">Small</option>
                <option value="md" selected>Medium</option>
                <option value="lg">Large</option>
                <option value="xl">Extra Large</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Width: <span id="width-value">auto</span></label>
              <input type="range" id="width-slider" min="0" max="600" value="0" class="w-full accent-purple-600">
              <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>auto</span>
                <span>600px</span>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Height: <span id="height-value">auto</span></label>
              <input type="range" id="height-slider" min="0" max="200" value="0" class="w-full accent-purple-600">
              <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>auto</span>
                <span>200px</span>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Font Size: <span id="font-size-value">16px</span></label>
              <input type="range" id="font-size-slider" min="10" max="32" value="16" class="w-full accent-purple-600">
              <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>10px</span>
                <span>32px</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Spacing Controls -->
        <div class="glass-card p-6 rounded-3xl">
          <h3 class="text-lg font-semibold mb-4 flex items-center">
            📐 여백
          </h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-2">Padding: <span id="padding-value">16px</span></label>
              <input type="range" id="padding-slider" min="0" max="48" value="16" class="w-full accent-purple-600">
              <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>0px</span>
                <span>48px</span>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Margin: <span id="margin-value">0px</span></label>
              <input type="range" id="margin-slider" min="0" max="48" value="0" class="w-full accent-purple-600">
              <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>0px</span>
                <span>48px</span>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Border Radius: <span id="radius-value">8px</span></label>
              <input type="range" id="radius-slider" min="0" max="32" value="8" class="w-full accent-purple-600">
              <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>0px</span>
                <span>32px</span>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Border Width: <span id="border-width-value">0px</span></label>
              <input type="range" id="border-width-slider" min="0" max="8" value="0" class="w-full accent-purple-600">
              <div class="flex justify-between text-xs text-gray-500 mt-1">
                <span>0px</span>
                <span>8px</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Advanced Options -->
        <div class="glass-card p-6 rounded-3xl">
          <h3 class="text-lg font-semibold mb-4 flex items-center">
            ⚙️ 고급 옵션
          </h3>
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-2">Shadow Intensity</label>
              <input type="range" id="shadow-slider" min="0" max="10" value="5" class="w-full accent-purple-600">
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Opacity</label>
              <input type="range" id="opacity-slider" min="0" max="100" value="100" class="w-full accent-purple-600">
            </div>
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium">Dark Mode</label>
              <button id="dark-mode-toggle" class="w-12 h-6 bg-gray-300 rounded-full relative transition-colors">
                <span class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="space-y-3">
          <button id="save-preset-btn" class="w-full btn-gradient px-6 py-3 rounded-xl font-semibold text-white hover:shadow-lg transition-all flex items-center justify-center space-x-2" disabled>
            <span>💾</span>
            <span>프리셋 저장</span>
          </button>
          <button id="reset-btn" class="w-full px-6 py-3 rounded-xl font-semibold border-2 border-gray-300 hover:border-purple-500 transition-all flex items-center justify-center space-x-2">
            <span>🔄</span>
            <span>초기화</span>
          </button>
        </div>
      </div>

      <!-- Live Preview -->
      <div class="lg:col-span-2">
        <div class="glass-card p-8 rounded-3xl sticky top-24">
          <div class="flex items-center justify-between mb-6">
            <h3 class="text-2xl font-semibold">실시간 미리보기</h3>
            <div class="flex space-x-2">
              <button class="preview-mode-btn active px-3 py-1 rounded-lg text-sm font-medium transition-all" data-mode="mobile">
                📱 Mobile
              </button>
              <button class="preview-mode-btn px-3 py-1 rounded-lg text-sm font-medium transition-all" data-mode="tablet">
                📱+ Tablet
              </button>
              <button class="preview-mode-btn px-3 py-1 rounded-lg text-sm font-medium transition-all" data-mode="desktop">
                💻 Desktop
              </button>
            </div>
          </div>

          <!-- Preview Container -->
          <div id="preview-container" class="bg-white/50 rounded-2xl p-8 min-h-[500px] flex items-center justify-center transition-all" data-mode="desktop">
            <div id="live-preview" class="transition-all">
              <div class="text-center text-gray-400 py-12">
                <p class="text-lg">컴포넌트를 선택하면 미리보기가 표시됩니다</p>
              </div>
            </div>
          </div>

          <!-- Code Tabs -->
          <div class="mt-6" id="code-section" style="display: none;">
            <div class="flex border-b border-gray-200 mb-4">
              <button class="code-tab-btn active px-4 py-2 font-medium" data-tab="html">HTML</button>
              <button class="code-tab-btn px-4 py-2 font-medium" data-tab="css">CSS</button>
              <button class="code-tab-btn px-4 py-2 font-medium" data-tab="js">JavaScript</button>
            </div>
            <div class="relative">
              <pre id="code-display" class="bg-gray-900 text-gray-100 p-4 rounded-xl overflow-x-auto text-sm font-mono max-h-[300px]"><code id="code-content">// 코드가 여기에 표시됩니다</code></pre>
              <button id="copy-code-btn" class="absolute top-4 right-4 px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-semibold hover:bg-purple-700 transition-colors">
                📋 복사
              </button>
            </div>
          </div>

          <!-- Export Button -->
          <div class="mt-6">
            <button id="export-code-btn" class="w-full btn-outline px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all flex items-center justify-center space-x-2" disabled>
              <span>📦</span>
              <span>전체 코드 내보내기</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Save Preset Modal -->
  <div id="save-preset-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50">
    <div class="glass-card p-8 rounded-3xl max-w-md w-full mx-4">
      <h3 class="text-2xl font-bold mb-4">프리셋 저장</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-2">프리셋 이름</label>
          <input type="text" id="preset-name-input" placeholder="예: 내 버튼 스타일" class="w-full px-4 py-2 rounded-xl border border-gray-300 bg-white">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">설명 (선택사항)</label>
          <textarea id="preset-description-input" placeholder="이 프리셋에 대한 설명..." rows="3" class="w-full px-4 py-2 rounded-xl border border-gray-300 bg-white resize-none"></textarea>
        </div>
        <div class="flex space-x-3">
          <button id="save-preset-confirm" class="flex-1 btn-gradient px-6 py-3 rounded-xl font-semibold text-white hover:shadow-lg transition-all">
            저장
          </button>
          <button id="save-preset-cancel" class="flex-1 px-6 py-3 rounded-xl font-semibold border-2 border-gray-300 hover:border-purple-500 transition-all">
            취소
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/scripts/customize.js"></script>
</body>
</html>
