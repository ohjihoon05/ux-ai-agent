# 의존성 업데이트 알림. 주 1회, 작은 업데이트는 PR 하나로 묶어요.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/03-development/backend"
      - "/03-development/frontend/ux-research-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
